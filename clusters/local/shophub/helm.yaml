# Helm release definition for the ShopHub platform panel.
#
# Note: the shophub chart DOES bundle kube-prometheus-stack as a subchart so
# it can be installed standalone, but this cluster runs a shared, standalone
# kube-prometheus-stack release (clusters/local/kube-prometheus-stack), so the
# bundled copy is switched off in values.yaml via
# `kube-prometheus-stack.enabled: false`. Two prometheus-operators would
# otherwise reconcile the same cluster-wide objects. What this release brings
# is the panel (backend, frontend, ingress) plus the observability *content*
# (dashboards, PrometheusRule, ServiceMonitor, AlertmanagerConfig) that the
# shared release consumes.
#
# The chart is published from the helm-charts repository to GHCR on every
# push to develop and master, versioned as `0.0.0-<branch>-<short-sha>`.
# The pin below is the build from helm-charts develop @ 14ca2da; bump it to
# a clean SemVer once helm-charts cuts a `v*` release tag.
#
# Installed last, after kube-prometheus-stack, CNPG, REDB and shop-operator,
# so the panel can create Shop CRs against an operator that is already up.
chart: oci://ghcr.io/shophub-devops/charts/shophub
version: 0.0.0-develop-14ca2da
namespace: shophub
